[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmesh-sdk"
version = "0.1.0"
description = "OpenMesh Framework Python SDK for adapter development and validation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "OpenMesh Contributors"}
]
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.82",
]

[tool.setuptools.packages.find]
include = ["openmesh_sdk*"]
