# Sample Domain Registration — Serverless API
# Copy and customize this for your own business domains.

domain_id: "my-serverless-api"
runtime_type: "serverless"
observability_adapter: "packages.observability.adapters.serverless.adapter.ServerlessAdapter"
entity_id: "my-company"
lob_id: "p-lob-api"
roles:
  - superuser
  - admin
  - operator
tabs:
  - title: "Lambda Health"
    panel_type: "health_grid"
    data_source: "lambda_health"
  - title: "API Metrics"
    panel_type: "metric_chart"
    data_source: "metrics"
metadata:
  product_name: "Serverless API"
  version: "1.0.0"
  description: "Serverless API observability"
